name: Build and Release 3DSLink

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 3dslink-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl wget unzip bzip2 ca-certificates build-essential \
            autoconf automake libtool pkg-config python3 python3-pil gh
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      - name: Install modern 3DS libraries for launcher
        run: |
          if command -v dkp-pacman >/dev/null 2>&1; then
            dkp-pacman -S --noconfirm --needed citro2d citro3d
          else
            pacman -S --noconfirm --needed citro2d citro3d
          fi

      - name: Install ChirunoMod legacy toolchain
        run: |
          mkdir -p /opt/devkitpro-legacy
          curl -fL --retry 3 -o /tmp/devkitarm-r46.tar.bz2 \
            'https://wii.leseratte10.de/devkitPro/devkitARM/r46%20%282017%29/devkitARM_r46-x86_64-linux.tar.bz2'
          tar -xjf /tmp/devkitarm-r46.tar.bz2 -C /opt/devkitpro-legacy
          curl -fL --retry 3 -o /tmp/libctru-1.2.1.tar.bz2 \
            'https://wii.leseratte10.de/devkitPro/libctru/2017/libctru-1.2.1.tar.bz2'
          tar -xjf /tmp/libctru-1.2.1.tar.bz2 -C /opt/devkitpro-legacy
          armgcc="$(find /opt/devkitpro-legacy -type f -name arm-none-eabi-gcc | head -n 1)"
          test -n "$armgcc"
          armroot="$(dirname "$(dirname "$armgcc")")"
          if [ "$armroot" != "/opt/devkitpro-legacy/devkitARM" ]; then
            rm -rf /opt/devkitpro-legacy/devkitARM
            ln -s "$armroot" /opt/devkitpro-legacy/devkitARM
          fi
          ctru_header="$(find /opt/devkitpro-legacy -type f -path '*/include/3ds.h' | grep -v '/devkitARM/' | head -n 1)"
          test -n "$ctru_header"
          ctruroot="$(dirname "$(dirname "$ctru_header")")"
          if [ "$ctruroot" != "/opt/devkitpro-legacy/libctru" ]; then
            rm -rf /opt/devkitpro-legacy/libctru
            ln -s "$ctruroot" /opt/devkitpro-legacy/libctru
          fi
          test -x /opt/devkitpro-legacy/devkitARM/bin/arm-none-eabi-gcc
          test -f /opt/devkitpro-legacy/libctru/include/3ds.h

      - name: Build legacy 3DS zlib and turbojpeg
        run: |
          export DEVKITPRO=/opt/devkitpro-legacy
          export DEVKITARM=/opt/devkitpro-legacy/devkitARM
          export CTRULIB=/opt/devkitpro-legacy/libctru
          export PATH="$DEVKITARM/bin:$PATH"
          git clone --depth 1 https://github.com/LoveMHz/3DS-Portlibs.git /tmp/3ds-portlibs-legacy
          cd /tmp/3ds-portlibs-legacy
          sed -i 's/CFLAGS+="\\"-Drandom()=rand()\\"" //g' Makefile
          make zlib install-zlib
          make libjpeg-turbo install

      - name: Clone ChirunoMod base
        run: git clone --depth 1 --branch nightly-v4 https://github.com/ChainSwordCS/ChirunoMod.git upstream

      - name: Apply 3DSLink base patches and artwork
        run: |
          python3 scripts/prepare_upstream.py
          cp src/launcher.c upstream/HzLoad/soos/main.c
          base64 -d assets/icon.b64 > /tmp/3dslink-icon.png
          python3 - <<'PY'
          from PIL import Image
          src = Image.open('/tmp/3dslink-icon.png').convert('RGBA')
          src.resize((48,48), Image.Resampling.LANCZOS).save('upstream/HzLoad/assets/logo.png')
          banner = Image.new('RGBA',(256,128),(255,154,20,255))
          art = src.resize((112,112), Image.Resampling.LANCZOS)
          banner.alpha_composite(art,((256-112)//2,8))
          banner.convert('RGB').save('upstream/HzLoad/assets/banner.png')
          PY

      - name: Patch stable strip streaming runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upstream/soos/main.cpp')
          s=p.read_text()
          s=s.replace('#include "3dslink_web.h"', '#include "3dslink_web.h"\n\n#define PatStay(...) ((void)0)\n#define PatApply() ((void)0)')
          s=s.replace('sao.sin_addr.s_addr = gethostid();','sao.sin_addr.s_addr = htonl(INADDR_ANY);')

          # Keep ChirunoMod's proven Old-3DS 8-strip DMA geometry. The browser
          # now hides all partial strips and swaps only complete frames onscreen.
          s=s.replace('tjpixelformat = TJPF_RGB;', 'tjpixelformat = TJPF_BGR;')
          s=s.replace('netfunc_thread_priority = 0x14;', 'netfunc_thread_priority = 0x20;')
          s=s.replace('svcSleepThread(5e6);', 'svcSleepThread(1e6);')
          s=s.replace('cfgblk[1] = 58;', 'cfgblk[1] = 24;')

          # Top-only mode actually stops bottom-screen work.
          s=s.replace('if(strstr(request, "GET /stream ") == request)', 'if(strncmp(request, "GET /stream", 11) == 0)')
          old='''                        gBrowserStream = true;\n                        cfgblk[0] = 1;\n                        cfgblk[1] = 24;\n                        cfgblk[3] = 3;\n                        cfgblk[4] = 0;'''
          new='''                        gBrowserStream = true;\n                        cfgblk[0] = 1;\n                        cfgblk[1] = 24;\n                        cfgblk[3] = strstr(request, "screen=top") ? 1 : 3;\n                        cfgblk[4] = 0;'''
          if old in s:
              s=s.replace(old,new,1)
          else:
              s=s.replace('cfgblk[3] = 3;\n                        cfgblk[4] = 0;', 'cfgblk[3] = strstr(request, "screen=top") ? 1 : 3;\n                        cfgblk[4] = 0;',1)
          p.write_text(s)

          p=Path('upstream/Makefile')
          m=p.read_text().replace('-D__3DS__','-DARM11 -D_3DS')
          p.write_text(m)
          PY

      - name: Patch launcher for current libctru
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upstream/HzLoad/Makefile')
          m=p.read_text()
          m=m.replace('LIBS\t:= -lctru -lm','LIBS\t:= -lcitro2d -lcitro3d -lctru -lm')
          m=m.replace('$(OUTPUT).cia: $(OUTPUT)-stripped.elf $(TOPDIR)/$(BUILD)/image.bin','$(OUTPUT).cia: $(OUTPUT)-stripped.elf $(TOPDIR)/$(BUILD)/banner.bin $(TOPDIR)/$(BUILD)/image.bin')
          m=m.replace(' -icon $(TOPDIR)/$(BUILD)/image.bin -DAPP_TITLE=',' -icon $(TOPDIR)/$(BUILD)/image.bin -banner $(TOPDIR)/$(BUILD)/banner.bin -DAPP_TITLE=')
          # prepare_upstream.py replaces inherited banner audio with a WAV made
          # entirely of zero samples, so the HOME Menu cannot BIBIBIBI at us.
          p.write_text(m)
          PY

      - name: Install makerom and bannertool
        run: |
          curl -sSL -o /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip
          unzip -o /tmp/makerom.zip -d /usr/local/bin
          chmod +x /usr/local/bin/makerom
          curl -sSL -o /tmp/bannertool.zip https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip
          unzip -oj /tmp/bannertool.zip 'linux-x86_64/bannertool' -d /usr/local/bin
          chmod +x /usr/local/bin/bannertool

      - name: Build 3DSLink module with legacy toolchain
        run: |
          export DEVKITPRO=/opt/devkitpro-legacy
          export DEVKITARM=/opt/devkitpro-legacy/devkitARM
          export CTRULIB=/opt/devkitpro-legacy/libctru
          export PATH="$DEVKITARM/bin:/usr/local/bin:$PATH"
          cd upstream
          make clean || true
          make -j2
          test -f 3DSLinkModule.cia

      - name: Build 3DSLink launcher with current toolchain
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export CTRULIB=/opt/devkitpro/libctru
          export PATH="$DEVKITARM/bin:/usr/local/bin:$PATH"
          cd upstream/HzLoad
          make clean || true
          make -j2
          test -f 3DSLink.cia

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3DSLink-alpha-7
          path: |
            upstream/HzLoad/3DSLink.cia
            upstream/3DSLinkModule.cia
            upstream/3DSLinkModule.elf
            upstream/chirunomod-build/3DSLinkModule.map
          if-no-files-found: error

      - name: Publish alpha release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-alpha.7
        run: |
          NOTES='Seventh hardware-test alpha. Restores the proven Old-3DS 8-strip capture geometry so the module stays within its tiny memory budget, but the browser now assembles strips offscreen and swaps only COMPLETE frames onto the visible canvas. No visible pillar-by-pillar drawing. Top-only mode disables bottom capture. JPEG quality and sleep are tuned for motion while retaining the lower-priority thread. HOME Menu audio remains pure digital silence. Install BOTH CIAs.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" upstream/HzLoad/3DSLink.cia upstream/3DSLinkModule.cia --clobber
          else
            gh release create "$TAG" upstream/HzLoad/3DSLink.cia upstream/3DSLinkModule.cia --target "$GITHUB_SHA" --title '3DSLink v0.1.0 alpha 7' --prerelease --notes "$NOTES"
          fi
