name: Build and Release 3DSLink

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 3dslink-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl wget unzip ca-certificates build-essential \
            autoconf automake libtool pkg-config python3 python3-pil gh
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      - name: Install 3DS libraries
        run: |
          if command -v dkp-pacman >/dev/null 2>&1; then
            dkp-pacman -S --noconfirm --needed 3ds-zlib 3ds-citro2d 3ds-citro3d
          else
            pacman -S --noconfirm --needed 3ds-zlib 3ds-citro2d 3ds-citro3d
          fi

      - name: Build 3DS turbojpeg portlib
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          git clone --depth 1 https://github.com/LoveMHz/3DS-Portlibs.git /tmp/3ds-portlibs
          cd /tmp/3ds-portlibs
          sed -i 's/CFLAGS+="\\"-Drandom()=rand()\\"" //g' Makefile
          make libjpeg-turbo
          make install
          test -f /opt/devkitpro/portlibs/armv6k/include/turbojpeg.h

      - name: Clone ChirunoMod base
        run: git clone --depth 1 --branch nightly-v4 https://github.com/ChainSwordCS/ChirunoMod.git upstream

      - name: Apply 3DSLink patches and artwork
        run: |
          python3 scripts/prepare_upstream.py
          cp src/launcher.c upstream/HzLoad/soos/main.c
          base64 -d assets/icon.b64 > /tmp/3dslink-icon.png
          python3 - <<'PY'
          from PIL import Image
          import wave, struct

          src = Image.open('/tmp/3dslink-icon.png').convert('RGBA')
          src.resize((48, 48), Image.Resampling.LANCZOS).save('upstream/HzLoad/assets/logo.png')

          banner = Image.new('RGBA', (256, 128), (255, 154, 20, 255))
          art = src.resize((112, 112), Image.Resampling.LANCZOS)
          banner.alpha_composite(art, ((256 - 112)//2, 8))
          banner.convert('RGB').save('upstream/HzLoad/assets/banner.png')

          with wave.open('upstream/HzLoad/assets/banner.wav', 'wb') as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(22050)
              w.writeframes(struct.pack('<h', 0) * 2205)
          PY

      - name: Patch current libctru compatibility and alpha stability
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('upstream/soos/main.cpp')
          s = p.read_text()
          s = s.replace('GSPGPU_FramebufferFormats', 'GSPGPU_FramebufferFormat')
          s = s.replace('int dmaState = 0;', 'DmaState dmaState = DMASTATE_STARTING;')
          s = s.replace('svcFlushProcessDataCache(0xFFFF8001, (u8*)screenbuf,', 'svcFlushProcessDataCache(0xFFFF8001, (u32)screenbuf,')
          s = s.replace('svcStartInterProcessDma(&dmahand,0xFFFF8001,screenbuf,srcprochand,srcaddr,siz,dma_config[scr])', 'svcStartInterProcessDma(&dmahand,0xFFFF8001,(u32)screenbuf,srcprochand,(u32)srcaddr,siz,(const DmaConfig*)dma_config[scr])')
          s = s.replace('#include "3dslink_web.h"', '#include "3dslink_web.h"\n\n// 3DSLink does not use the console notification LED as a status display.\n#define PatStay(...) ((void)0)\n#define PatApply() ((void)0)')
          s = s.replace('sao.sin_addr.s_addr = gethostid();', 'sao.sin_addr.s_addr = htonl(INADDR_ANY);')
          p.write_text(s)

          p = Path('upstream/HzLoad/Makefile')
          m = p.read_text()
          m = m.replace('LIBS\t:= -lctru -lm', 'LIBS\t:= -lcitro2d -lcitro3d -lctru -lm')
          m = m.replace('$(OUTPUT).cia: $(OUTPUT)-stripped.elf $(TOPDIR)/$(BUILD)/image.bin', '$(OUTPUT).cia: $(OUTPUT)-stripped.elf $(TOPDIR)/$(BUILD)/banner.bin $(TOPDIR)/$(BUILD)/image.bin')
          m = m.replace(' -icon $(TOPDIR)/$(BUILD)/image.bin -DAPP_TITLE=', ' -icon $(TOPDIR)/$(BUILD)/image.bin -banner $(TOPDIR)/$(BUILD)/banner.bin -DAPP_TITLE=')
          p.write_text(m)
          PY
          rm -f upstream/soos/service/gx.c
          sed -i 's#^LIBDIRS.*#LIBDIRS := $(CTRULIB) $(DEVKITPRO)/portlibs/armv6k $(DEVKITPRO)/portlibs/3ds#' upstream/Makefile

      - name: Install makerom and bannertool
        run: |
          curl -sSL -o /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip
          unzip -o /tmp/makerom.zip -d /usr/local/bin
          chmod +x /usr/local/bin/makerom
          curl -sSL -o /tmp/bannertool.zip https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip
          unzip -oj /tmp/bannertool.zip 'linux-x86_64/bannertool' -d /usr/local/bin
          chmod +x /usr/local/bin/bannertool

      - name: Build 3DSLink module
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          cd upstream
          make -j2
          test -f 3DSLinkModule.cia

      - name: Build 3DSLink launcher
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          cd upstream/HzLoad
          make -j2
          test -f 3DSLink.cia

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3DSLink-alpha-2
          path: |
            upstream/HzLoad/3DSLink.cia
            upstream/3DSLinkModule.cia
          if-no-files-found: error

      - name: Publish alpha release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-alpha.2
        run: |
          NOTES='Second hardware-test alpha. Changes: proper HOME Menu top-screen banner, app-style launcher UI, HOME button disabled inside the launcher to avoid the alpha-1 HOME crash path, notification-LED status colors removed, server binds to all Wi-Fi interfaces, and the launcher checks whether port 8080 is actually answering. Install BOTH 3DSLink.cia and 3DSLinkModule.cia with FBI. No audio streaming yet.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" upstream/HzLoad/3DSLink.cia upstream/3DSLinkModule.cia --clobber
          else
            gh release create "$TAG" upstream/HzLoad/3DSLink.cia upstream/3DSLinkModule.cia --target "$GITHUB_SHA" --title '3DSLink v0.1.0 alpha 2' --prerelease --notes "$NOTES"
          fi
