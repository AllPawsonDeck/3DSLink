<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3DSLink</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center}.app{width:min(920px,96vw);padding:18px}.toolbar{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:9px 13px;background:#2b2b2b;color:#fff;cursor:pointer}button:hover{background:#3b3b3b}.shell{margin:auto;width:min(760px,94vw)}.half{background:#b21f2d;border-radius:24px;padding:24px;box-shadow:0 10px 30px #0008}.hinge{height:18px;width:78%;margin:auto;background:#6f111b;border-radius:8px}.screen{display:block;background:#000;margin:auto;object-fit:contain}.top{width:100%;aspect-ratio:400/240}.bottom{width:78%;aspect-ratio:320/240}.clean .half{background:transparent;padding:8px;box-shadow:none}.clean .hinge{display:none}.clean .bottom{width:80%}.toponly .bottomhalf,.toponly .hinge{display:none}.toponly .tophalf{background:transparent;padding:0;box-shadow:none}.toponly .top{width:100%;max-height:94vh}.popcontrols{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}body.popout .toolbar,body.popout .popcontrols,body.popout .hinge{display:none}body.popout .app{width:100%;height:100%;padding:0}body.popout .shell{width:100%;height:100%}body.popout .half{background:transparent;padding:0;box-shadow:none;border-radius:0}body.popout .screen{width:100%;height:100%;object-fit:contain}body.popout .bottomhalf{display:none}body.popout.bottom .tophalf{display:none}body.popout.bottom .bottomhalf{display:block;width:100%;height:100%}body.popout.both .tophalf,body.popout.both .bottomhalf{display:flex;height:50%}body.popout.both .screen{max-height:100%}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <button onclick="setMode('shell')">3DS</button>
    <button onclick="setMode('clean')">Screens</button>
    <button onclick="setMode('toponly')">Top only</button>
  </div>
  <div id="shell" class="shell">
    <div class="half tophalf"><img class="screen top" src="/stream/top.mjpg" alt="Top screen"></div>
    <div class="hinge"></div>
    <div class="half bottomhalf"><img class="screen bottom" src="/stream/bottom.mjpg" alt="Bottom screen"></div>
  </div>
  <div class="popcontrols">
    <button onclick="pop('top')">Pop out top</button>
    <button onclick="pop('bottom')">Pop out bottom</button>
    <button onclick="pop('both')">Pop out both</button>
  </div>
</div>
<script>
const params=new URLSearchParams(location.search);const popMode=params.get('pop');if(popMode){document.body.classList.add('popout',popMode);if(popMode==='top')document.body.classList.add('toponly')}
function setMode(mode){const s=document.getElementById('shell');s.className='shell';if(mode!=='shell')s.classList.add(mode)}
function pop(which){const w=which==='both'?760:(which==='top'?800:640);const h=which==='both'?900:520;window.open(location.pathname+'?pop='+which,'3DSLink-'+which,`popup=yes,width=${w},height=${h}`)}
</script>
</body>
</html>
